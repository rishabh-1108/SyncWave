<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sync-Wave | The Future of Sound</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="background-anim">
        <div class="glow-orb orb-1"></div>
        <div class="glow-orb orb-2"></div>
        <div class="glow-orb orb-3"></div>
    </div>
    
    <div class="app-container">
        <!-- Top Navigation -->
        <header class="navbar">
            <div class="brand">
                <i class="fa-solid fa-water brand-icon"></i>
                <span class="brand-text">SYNC<span class="brand-accent">-WAVE</span></span>
            </div>
            <div class="nav-menu">
                <a href="#" class="active">Discover</a>
                <a href="#">Trending</a>
                <a href="#">Library</a>
            </div>
            <div class="user-profile">
                <img src="./assets/sync_wave.png" alt="Profile" class="avatar">
            </div>
        </header>

        <!-- Main Content Area -->
        <main class="main-layout">
            <!-- Left Side: Now Playing Visuals -->
            <section class="visualizer-section">
                <div class="player-halo">
                    <div class="halo-ring ring-1"></div>
                    <div class="halo-ring ring-2"></div>
                    <div class="halo-ring ring-3"></div>
                    <img src="./assets/sync_wave.png" alt="Current Track" class="track-artwork" id="main-artwork">
                </div>
                <div class="track-meta-large">
                    <h1 class="track-title-large" id="main-title">Select a Track</h1>
                    <h2 class="track-artist-large" id="main-artist">Welcome to Sync-Wave</h2>
                </div>
            </section>

            <!-- Right Side: Playlist -->
            <section class="playlist-section">
                <div class="glass-panel">
                    <div class="playlist-header">
                        <h2>Up Next</h2>
                        <span class="song-count" id="total-songs">0 Tracks</span>
                    </div>
                    <div class="playlist-container" id="song-list">
                        <!-- Songs injected here via JS -->
                    </div>
                </div>
            </section>
        </main>

        <!-- Floating Player Controls -->
        <footer class="player-dock glass-panel">
            <div class="dock-left">
                <img src="./assets/sync_wave.png" alt="Thumb" class="dock-thumb" id="dock-cover">
                <div class="dock-info">
                    <div class="dock-title" id="dock-title">Ready to Sync</div>
                    <div class="dock-artist" id="dock-artist">Press Play</div>
                </div>
            </div>

            <div class="dock-center">
                <div class="controls-main">
                    <button class="btn-control btn-small" id="shuffle-btn"><i class="fa-solid fa-shuffle"></i></button>
                    <button class="btn-control" id="prev-btn"><i class="fa-solid fa-backward-step"></i></button>
                    <button class="btn-play" id="play-pause-btn"><i class="fa-solid fa-play"></i></button>
                    <button class="btn-control" id="next-btn"><i class="fa-solid fa-forward-step"></i></button>
                    <button class="btn-control" id="repeat-btn"><i class="fa-solid fa-repeat"></i></button>
                </div>
                <div class="progress-wrapper">
                    <span class="time" id="current-time">0:00</span>
                    <div class="progress-bar-bg" id="progress-container">
                        <div class="progress-bar-fill" id="progress-bar">
                            <div class="progress-knob"></div>
                        </div>
                    </div>
                    <span class="time" id="total-time">0:00</span>
                </div>
            </div>

            <div class="dock-right">
                <i class="fa-solid fa-volume-high volume-icon"></i>
                <div class="volume-wrapper" id="volume-container">
                    <div class="volume-fill" id="volume-bar">
                        <div class="volume-knob"></div>
                    </div>
                </div>
            </div>
        </footer>
    </div>

    <!-- Hidden audio element -->
    <audio id="audio-element" crossorigin="anonymous"></audio>

    <script src="app.js"></script>
</body>
</html>
